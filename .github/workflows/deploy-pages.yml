name: Build and publish site

# Cloudflare Pages is the publication destination — it serves both live custom
# domains, and it is the only place this workflow publishes.
#
# Until 17 September 2026 the same build also went to GitHub Pages as a preview
# at dakibwa.github.io. That only worked while this repository was named
# dakibwa.github.io and owned the root of that host: the export is built for
# `/`, so under a project path every asset would 404. The preview went when the
# repository was renamed to portuguese-with-ines.
#
# Before this workflow existed, publishing meant remembering to run
# `npm run deploy:cloudflare` by hand after merging. Pushing to main updated
# only the preview, which is easy to mistake for a completed release: the
# commit is on main, Actions is green, and the live site is still the old one.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# The site's public configuration. The build bakes it in, and the check of the
# live Worker reads the same values, so the two can never be compared against
# different ones.
env:
  # Booking is served by the ines-booking Worker. The `booking` job below fails
  # the release if it is missing or unhealthy, so a release can never quietly
  # ship a dead calendar.
  NEXT_PUBLIC_BOOKING_API_BASE_URL: ${{ vars.NEXT_PUBLIC_BOOKING_API_BASE_URL }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
  # Production must never mount a sandbox Checkout client secret. The
  # release gate compares this with both the Worker and publishable key.
  NEXT_PUBLIC_STRIPE_EXPECTED_MODE: live
  # Public by design: it identifies the app, and the Worker verifies every
  # Google token against it. Absent simply hides the Google button.
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
  LESSON_PRICE_CENTS: ${{ vars.LESSON_PRICE_CENTS || '2500' }}
  LESSON_CURRENCY: ${{ vars.LESSON_CURRENCY || 'eur' }}
  NEXT_PUBLIC_LESSON_DURATION_MINUTES: ${{ vars.NEXT_PUBLIC_LESSON_DURATION_MINUTES || '60' }}
  NEXT_PUBLIC_SAME_DAY_RESCHEDULE_FEE_CENTS: ${{ vars.NEXT_PUBLIC_SAME_DAY_RESCHEDULE_FEE_CENTS || '500' }}

# How a release runs (11 November 2026, Dan: "I like fast relsases"). Until then
# everything ran in one line, and the customer journeys alone, one after
# another on one machine, had grown past seven minutes of a ten-minute release.
# Now only what truly depends on something else waits for it:
#
#   worker ──┬── booking ───────────┐
#            └── journeys (four) ───┼── publish
#   build ───────┘                  │
#   checks ─────────────────────────┘
#
# The Worker still ships first, and nothing is published unless every job here
# passes.

jobs:
  # The booking Worker ships first, from the same commit, once its own tests
  # pass, so the site below is always checked against the Worker it will talk
  # to. Until October 2026 this was a manual `npm run worker:deploy`
  # after each merge, which was easy to forget: a release could publish a site
  # expecting Worker changes that were not live yet.
  #
  # It runs only when the repository variable DEPLOY_WORKER is "true", set once
  # the CLOUDFLARE_API_TOKEN secret is confirmed to carry "Workers Scripts:
  # Edit" (the Pages deploy alone needs less). Without it the job says so and
  # the release carries on as before.
  #
  # D1 migrations are deliberately not applied here: the production database's
  # d1_migrations table is empty (every migration was applied by hand), so an
  # automatic `migrations apply` would try to re-run all of them. A change that
  # needs a migration still has it applied by hand before merging.
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless Worker deploys are enabled
        if: vars.DEPLOY_WORKER != 'true'
        run: echo "::notice::DEPLOY_WORKER is not 'true', so the booking Worker is not deployed by this release. Run npm run worker:deploy by hand if this release changes workers/."

      - name: Checkout
        if: vars.DEPLOY_WORKER == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: vars.DEPLOY_WORKER == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: vars.DEPLOY_WORKER == 'true'
        run: npm ci

      - name: Run booking tests
        if: vars.DEPLOY_WORKER == 'true'
        run: npm run test:booking

      - name: Deploy the booking Worker
        if: vars.DEPLOY_WORKER == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/booking/wrangler.jsonc

  # Types, lint and the unit tests. They need neither the Worker nor the built
  # site, so they run beside both, and the publish waits for them all the same.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The worker job runs the booking tests when it deploys; without it, run them here.
      - name: Run fast check
        run: npm run ${{ vars.DEPLOY_WORKER == 'true' && 'check:site' || 'check:fast' }}

  # The export this release publishes, built once. Building asks nothing of the
  # Worker (the pages call it from the browser), so it does not wait for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # The plain directory the journeys check and the Cloudflare deploy needs.
      # Hidden files are kept because the export carries dotfiles the deploy
      # would otherwise lose; _headers is not one of them, but it does have to
      # survive the round trip, since it is the whole cache policy.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 1

  # The live Worker, once this release's own has shipped: it answers, has
  # lessons to offer, sends real email, and its Stripe mode matches the key the
  # site was built with. The script uses nothing but Node, so nothing is
  # installed.
  booking:
    name: Check the live booking Worker
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the booking Worker is healthy
        run: npm run check:booking

  # The customer journeys, against the built export this release publishes and
  # the Worker it will talk to. They once ran only locally and rotted silently,
  # so a broken journey blocks the release. Kept lean (13 October 2026, Dan:
  # "always be as lean as possible"): focused checks of what protects students
  # and Inês (booking, paying, signing in, her schedule), at one desktop and
  # one phone width. Money, clashes and clock changes are proven by the Worker
  # and calendar unit tests, not repeated here.
  #
  # Each line below is one machine's share, run one after another on a machine
  # of its own, so the journeys keep the quiet conditions they were written
  # for. (Run side by side on one machine, the teacher's journey lost a race
  # with itself.) The shares are balanced by how long each journey takes, which
  # every run lists on its summary page: when one grows, move a journey to a
  # lighter line. A journey that is on no line is never run.
  journeys:
    runs-on: ubuntu-latest
    needs: [worker, build]
    strategy:
      # Every share runs to its end, so one release shows everything broken.
      fail-fast: false
      matrix:
        checks:
          - qa-flow qa-workspace-navigation check-portfolio-banner
          - qa-teacher-calendar qa-auth-recovery qa-payment-recovery
          - qa-selection-calendar-recovery qa-meet-links qa-homework
          - qa-transition-kit qa-request-recovery qa-booking-selection qa-expression-translations qa-profile-rates qa-student-nif
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept between releases, so most only confirm the browser is there.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The browser alone, from Playwright's own store. `--with-deps` asked
      # Ubuntu's servers for nine fallback font packages and nothing else: the
      # runner already has every library Chromium needs, and the site draws
      # with its own bundled fonts. On 11 November 2026 five releases in a row
      # failed at that step when the runner could not resolve those servers.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Check customer journeys against the built site
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          # localhost, not 127.0.0.1: the browser sends the host it was given as
          # the Origin, and the Worker's allow-list carries localhost:3000.
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          {
            echo "| Journey | Result | Seconds |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=""
          for check in $CHECKS; do
            echo "::group::$check"
            start=$SECONDS
            if QA_BASE_URL=http://localhost:3000 node "scripts/$check.mjs"; then
              result="passed"
            else
              result="FAILED"
              failed="$failed $check"
            fi
            echo "::endgroup::"
            echo "$check $result in $((SECONDS - start))s"
            echo "| $check | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed. Each journey's output is in its group above."
            exit 1
          fi

  publish-cloudflare:
    name: Publish to Cloudflare Pages (live)
    runs-on: ubuntu-latest
    needs: [checks, build, booking, journeys]
    steps:
      - name: Check Cloudflare credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "The live domains are served by Cloudflare Pages, so without these"
            echo "the site does not publish. Add them under Settings > Secrets and"
            echo "variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=portuguese-with-ines --branch=main
