name: Vowel platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vowel-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:fast
      - run: npm run test:vowel
      - run: npm run build:vowel
      - run: npm run test:vowel:runtime
      # No provider credentials, live account creation, data migration or deploy.
      - run: npx wrangler deploy --config workers/vowel/wrangler.jsonc --dry-run
