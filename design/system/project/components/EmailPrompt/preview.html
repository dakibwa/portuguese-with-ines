<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EmailPrompt</title>
</head>
<body>
<div class="ds-preview"><!-- product --><section class="booking-provider"><section class="booking-steps"><section class="booking-stage booking-stage--lessons"><div class="unified-account-area"><section aria-labelledby="email-prompt-heading" class="card-prompt email-prompt card-prompt--open"><span aria-hidden="true" class="card-prompt__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg></span><div class="card-prompt__body"><h3 id="email-prompt-heading">Add your email</h3><p>So you can sign in on any phone or computer.</p><form class="email-prompt__form"><label><span class="visually-hidden">Your email</span><input autocapitalize="none" autocomplete="email" autocorrect="off" placeholder="you@example.com" spellcheck="false" type="email" value=""></label><button class="button button--coral button--compact" disabled="" type="submit">Add email</button></form></div></section></div></section></section></section><!-- /product --></div>
<script>document.documentElement.setAttribute("data-booking-account","")</script>
</body>
